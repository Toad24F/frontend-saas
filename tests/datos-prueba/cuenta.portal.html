<!doctype html>
<html lang="es" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil · Revisión ficticia</title></head>
<body><main class="cuenta-pagina" style="max-width:1000px;margin:32px auto;padding:20px"><h1>Mi cuenta</h1><p>Revisión del componente con datos ficticios. Sin sesión ni API real.</p><button class="btn btn-light" id="tema">Cambiar tema</button><div id="contenido-prueba"></div></main>
<script type="module">
  import 'bootstrap/dist/css/bootstrap.min.css';
  import '../../src/shared/global.estilos.css';
  import '../../src/shared/tema.estilos.css';
  import '../../src/connected/screens/cuenta/cuenta.estilos.css';
  import '../../src/shared/cuenta.portal.css';
  import { renderPortalCuenta, vincularPortalCuenta } from '../../src/shared/cuenta.portal.js';
  // El caso predeterminado reproduce el contrato actual: no expone el slug.
  // El caso demo comprueba controles con un enlace ficticio y ?demo=1 explícito.
  const demo = new URL(location.href).searchParams.get('caso') === 'demo';
  document.querySelector('#contenido-prueba').innerHTML = renderPortalCuenta({
    usuario: { rol: 'admin_negocio', negocioId: 7 },
    negocio: { id: 7, slug: demo ? 'clinica-bienestar' : '' }, origen: location.origin, demo,
  });
  vincularPortalCuenta(document);
  document.querySelector('#tema').onclick = () => {
    document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  };
</script></body></html>
